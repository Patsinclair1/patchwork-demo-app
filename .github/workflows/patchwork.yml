name: Patchwork scan
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Production usage: uses: patchworkfix/patchwork-action@v1
      - uses: ./.github/actions/patchwork
        with:
          fail-on: critical
